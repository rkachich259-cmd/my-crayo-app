<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crayo AI - رفع وقص الفيديوهات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #0d1117;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 680px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            color: #58a6ff;
            font-size: 32px;
            margin-bottom: 8px;
        }
        p.subtitle {
            text-align: center;
            color: #8b949e;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 15px;
        }
        input[type="file"] {
            cursor: pointer;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #238636;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #2ea043;
        }
        button:disabled {
            background: #484f58;
            cursor: not-allowed;
        }
        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }
        .status-box.loading {
            display: block;
            background: #1f6beb33;
            color: #58a6ff;
            border: 1px solid #1f6beb;
        }
        .status-box.error {
            display: block;
            background: #da363333;
            color: #f85149;
            border: 1px solid #da3633;
        }
        .clips-container {
            margin-top: 30px;
        }
        .clip-card {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .clip-card h3 {
            margin-top: 0;
            color: #79c0ff;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 10px;
        }
        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 18px;
            background: #1f6beb;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            text-align: center;
        }
        .download-btn:hover {
            background: #388bfd;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 Crayo AI Clipper</h1>
    <p class="subtitle">قم برفع فيديو من جهازك واستخرج أفضل 3 كليبات حماسية مجاناً</p>

    <form id="clipForm">
        <div class="form-group">
            <label for="videoFile">اختر ملف الفيديو من جهازك:</label>
            <input type="file" id="videoFile" accept="video/*" required>
        </div>

        <div class="form-group">
            <label for="apiKey">مفتاح Google Gemini API:</label>
            <input type="text" id="apiKey" placeholder="أدخل مفتاح AI الخاص بك هنا..." required>
        </div>

        <button type="submit" id="submitBtn">رفع وتحليل وقص الفيديو 🚀</button>
    </form>

    <div id="statusBox" class="status-box"></div>

    <div id="clipsResult" class="clips-container"></div>
</div>

<script>
    // رابط سيرفر Render الخاص بك
    const RENDER_BACKEND_URL = "https://my-crayo-app.onrender.com"; 

    const form = document.getElementById('clipForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');
    const clipsResult = document.getElementById('clipsResult');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const videoFile = document.getElementById('videoFile').files[0];
        const apiKey = document.getElementById('apiKey').value.trim();

        if (!videoFile || !apiKey) {
            alert('الرجاء اختيار ملف فيديو وإدخال مفتاح API');
            return;
        }

        // إعداد واجهة الإرسال
        submitBtn.disabled = true;
        statusBox.className = "status-box loading";
        statusBox.innerText = "⏳ جاري رفع الفيديو وتحليله وقصه بواسطة الذكاء الاصطناعي... قد يستغرق هذا دقيقة.";
        clipsResult.innerHTML = "";

        const formData = new FormData();
        formData.append('file', videoFile);
        formData.append('api_key', apiKey);

        try {
            const response = await fetch(`${RENDER_BACKEND_URL}/process`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok && data.status === "success") {
                statusBox.style.display = "none";
                
                if (data.clips && data.clips.length > 0) {
                    data.clips.forEach(clip => {
                        const fullClipUrl = `${RENDER_BACKEND_URL}${clip.url}`;
                        
                        const card = document.createElement('div');
                        card.className = 'clip-card';
                        card.innerHTML = `
                            <h3>${clip.title} (التوقيت: ${clip.time})</h3>
                            <video controls src="${fullClipUrl}"></video>
                            <a href="${fullClipUrl}" download class="download-btn">⬇️ تحميل الكليب</a>
                        `;
                        clipsResult.appendChild(card);
                    });
                } else {
                    statusBox.className = "status-box error";
                    statusBox.innerText = "تم التحليل ولكن لم يتم العثور على مقاطع مناسبة، النص الأصلي:\n" + data.raw_analysis;
                }
            } else {
                throw new Error(data.detail || "حدث خطأ غير معروف في السيرفر");
            }
        } catch (err) {
            statusBox.className = "status-box error";
            statusBox.innerText = "❌ فشلت العملية: " + err.message;
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
